
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'LOLACASADEMUNT'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run 
# dbt run or dbt build, all of your models will be built as a view in your data platform. 
# The configuration below will override this setting for models in the example folder to 
# instead be materialized as tables. Any models you add to the root of the models folder will 
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.

models:
  LOLACASADEMUNT:
    # Las tablas transient de Snowflake no tienen Fail-safe y su Time Travel es
    # de 1 día como máximo. Para tablas de consumo preferimos tablas normales.
    +transient: false

    # --- Staging: renombrado, casteo, limpieza y deduplicación, 1:1 con Bronze.
    #     Vistas: no ocupan almacenamiento y siempre reflejan Bronze.
    staging:
      +materialized: view
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      +tags: ['staging']
      comercial:
        +schema: comercial
      catalogo:
        +schema: catalogo
      tpv:
        +schema: tpv
      contador:
        +schema: contador

    # --- Silver: modelo normalizado en 3FN (una tabla por entidad).
    #     Tablas: se consultan muchas veces desde Gold.
    silver:
      +materialized: table
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      +schema: normalizado
      +tags: ['silver']

    # --- Gold: modelo en estrella para Power BI. La capa la marca la database;
    #     el tipo de tabla, el prefijo del modelo (dim_, fct_, int_).
    gold:
      +materialized: table
      +database: "{{ env_var('DBT_GOLD_DB') }}"
      +tags: ['gold']
      intermediate:
        +materialized: view
        +schema: intermediate
      core:
        +schema: core

# =============================================================================
# Seeds
# =============================================================================
# Van a Silver y no a Bronze: Bronze solo la escribe la herramienta de ingesta.
# Los tipos de columna (varchar para los códigos con ceros) están en _seeds.yml.
seeds:
  LOLACASADEMUNT:
    +database: "{{ env_var('DBT_SILVER_DB') }}"
    +schema: seeds
    +tags: ['seeds']