# =============================================================================
# Modelos Gold core: modelo en estrella para Power BI
# =============================================================================
# Dimensiones (dim_): el contexto para filtrar y agrupar
# Hechos (fct_): lo que se mide, numeros que se suman
# Los ratios (conversion, ticket medio, % objetivo...) se calculan en Power BI
# =============================================================================

models:
  - name: dim_fecha
    description: Calendario, una fila por dia (01/11/2024 - 31/12/2026).
    columns:
      - name: fecha
        description: Dia (PK).
        data_tests: [unique, not_null]
      - name: fecha_id
        description: Fecha como numero AAAAMMDD, para relacionar en Power BI.
        data_tests: [unique, not_null]
      - name: dia_semana
        description: 1 = lunes ... 7 = domingo.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
      - name: fecha_aa
        description: Mismo dia de la semana del año anterior (fecha - 364 dias), como en BI2GO.
        data_tests: [not_null]

  - name: dim_tienda
    description: >
      Tiendas con todo su contexto (area, area manager, formato, provincia,
      comunidad), una fila por tienda. Incluye las cerradas.
    columns:
      - name: tienda_id
        description: Codigo de la tienda (PK).
        data_tests: [unique, not_null]
      - name: tienda_nombre
        data_tests: [not_null]
      - name: formato
        data_tests: [not_null]
      - name: area_manager_nombre
        description: Area manager que lleva la tienda (a traves de su area).
        data_tests: [not_null]
      - name: comunidad_autonoma
        description: Nombre oficial de la comunidad (lo reconoce el mapa de Power BI).
        data_tests: [not_null]
      - name: esta_abierta
        description: FALSE si la tienda tiene fecha de cierre.

  - name: dim_franja
    description: Franjas de 30 minutos del horario comercial, una fila por franja.
    columns:
      - name: franja_id
        description: Codigo HHMM de inicio de la franja (PK).
        data_tests: [unique, not_null]
      - name: periodo
        data_tests:
          - accepted_values:
              arguments:
                values: ['MAÑANA', 'MEDIODÍA', 'TARDE', 'NOCHE']

  - name: dim_producto
    description: >
      Productos con todo su contexto (marca, temporada, capsula, familia),
      una fila por referencia.
    columns:
      - name: referencia
        description: Codigo del producto (PK).
        data_tests: [unique, not_null]
      - name: marca_nombre
        data_tests: [not_null]
      - name: temporada_nombre
        data_tests: [not_null]
      - name: capsula_nombre
        description: Nombre de la capsula, o "Sin cápsula" (accesorios y productos sin capsula).
        data_tests: [not_null]
      - name: familia
        data_tests: [not_null]
      - name: categoria
        data_tests:
          - accepted_values:
              arguments:
                values: ['Prenda', 'Accesorio']
      - name: imagen
        description: Foto del producto en base64 (data URI). Para la galeria de mas vendidos.

  - name: fct_objetivo_diario
    description: Objetivo de venta neta por tienda y dia (grano tienda + dia).
    columns:
      - name: objetivo_id
        description: Clave del objetivo, hash de tienda_id + fecha.
        data_tests: [unique, not_null]
      - name: tienda_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tienda')
                field: tienda_id
      - name: fecha
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha
      - name: objetivo_venta_neta
        description: Objetivo en euros. Se suma por periodo en Power BI.
        data_tests: [not_null]

  - name: fct_venta_diaria_tienda
    description: >
      Venta por tienda y dia (grano tienda + dia). Une el TPV nuevo (tickets
      sumados) y el TPV antiguo (legacy) con las mismas definiciones, para
      comparar con el año anterior.
    columns:
      - name: venta_diaria_id
        description: Clave, hash de tienda_id + fecha.
        data_tests: [unique, not_null]
      - name: tienda_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tienda')
                field: tienda_id
      - name: fecha
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha
      - name: venta_neta
        description: venta_bruta - importe_devoluciones.
        data_tests: [not_null]
      - name: origen
        data_tests:
          - accepted_values:
              arguments:
                values: ['TPV_NUEVO', 'LEGACY']