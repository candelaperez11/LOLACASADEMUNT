# =============================================================================
# Modelos de staging de catalogo
# =============================================================================

models:
  - name: stg_catalogo__productos
    description: Catálogo limpio, una fila por referencia.
    columns:
      - name: referencia
        description: Código del producto (PK), con guion bajo y en mayúsculas.
        data_tests: [unique, not_null]
      - name: marca_id
        description: L = Lola Casademunt, M = Maite (primer carácter de la referencia).
        data_tests:
          - accepted_values:
              arguments:
                values: ['L', 'M']
      - name: codigo_familia
        description: Dígitos 5-6 de la referencia.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('familias_agregadas')
                field: codigo_familia
      - name: temporada_id
        data_tests: [not_null]
      - name: capsula_codigo
        description: Código de la cápsula. Solo es único dentro de su temporada.
      - name: es_45_aniversario
        description: TRUE si el nombre original llevaba el sufijo 45a.
      - name: pvp_es
        description: Precio en España. Nulo en FW25-26 (se imputa en Silver).

  - name: stg_catalogo__imagenes_producto
    description: Imagen en base64 de cada referencia.
    columns:
      - name: referencia
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_catalogo__productos')
                field: referencia
              config:
                severity: warn
