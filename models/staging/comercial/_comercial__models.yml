# =============================================================================
# Modelos de staging de comercial
# =============================================================================
# En este proyecto staging limpia y deduplica (Silver normaliza a 3FN), así que
# aquí ya se garantiza la unicidad: unique + not_null en la clave de cada modelo.
# =============================================================================

models:
  - name: stg_comercial__tiendas
    description: Tiendas limpias, una fila por tienda (incluye las cerradas).
    columns:
      - name: tienda_id
        description: Código de la tienda (PK).
        data_tests: [unique, not_null]
      - name: tienda_nombre
        data_tests: [not_null]
      - name: tipo_tienda
        data_tests:
          - accepted_values:
              arguments:
                values: ['TIENDA', 'OUTLET', 'CORNER ECI']
      - name: seccion
        data_tests:
          - accepted_values:
              arguments:
                values: ['Completa', 'Mujer', 'Accesorios']
      - name: provincia
        description: Nombre de la provincia, igual que en el seed provincias.
        data_tests:
          - relationships:
              arguments:
                to: ref('provincias')
                field: provincia
      - name: comunidad_autonoma
        description: Nombre oficial de la comunidad, igual que en el seed comunidades_autonomas.
        data_tests:
          - relationships:
              arguments:
                to: ref('comunidades_autonomas')
                field: comunidad_autonoma
      - name: telefono
        description: Teléfono en formato E.164 (+34...). Nulo si la tienda no tiene.
      - name: m2
        data_tests: [not_null]
      - name: abre_domingo
        data_tests: [not_null]
      - name: fecha_apertura
        data_tests: [not_null]
      - name: fecha_cierre
        description: Informada solo en las tiendas cerradas.

  - name: stg_comercial__estructura_comercial
    description: Área y área manager de cada tienda.
    columns:
      - name: tienda_id
        description: Código de la tienda (PK).
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_comercial__tiendas')
                field: tienda_id
      - name: area_manager_nombre
        data_tests:
          - accepted_values:
              arguments:
                values: ['Bea', 'Sara', 'Yolanda', 'Lola', 'Manel']

  - name: stg_comercial__objetivos_tienda_dia
    description: Objetivo de venta neta por tienda y día (uno por día).
    columns:
      - name: objetivo_id
        description: Clave tienda_id|fecha (PK).
        data_tests: [unique, not_null]
      - name: tienda_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_comercial__tiendas')
                field: tienda_id
      - name: fecha
        data_tests: [not_null]
      - name: objetivo_venta_neta
        data_tests: [not_null]

  - name: clientes
    description: Clientes del CRM. Contiene datos personales.
    columns:
      - name: cliente_id
        description: Codigo del cliente, el mismo que en los tickets.
      - name: nombre
        description: Nombre (a veces con espacios al final).
      - name: apellidos
        description: Apellidos.
      - name: email
        description: Email (a veces en mayusculas o vacio).
      - name: telefono
        description: Telefono en formatos distintos.
      - name: fecha_nacimiento
        description: Fecha de nacimiento, en dd/mm/aaaa o aaaa-mm-dd.
      - name: fecha_alta
        description: Fecha de alta en el CRM.
      - name: acepta_comunicaciones
        description: Consentimiento para marketing (SI, Si, 1, NO, 0, vacio...).
      - name: _loaded_at
        description: Momento de la carga en Bronze.

  - name: vendedores
    description: Vendedores de las tiendas (maestro de personal). Contiene datos personales.
    columns:
      - name: vendedor_id
        description: Codigo del vendedor, el mismo que en los tickets.
      - name: tienda_id
        description: Tienda en la que trabaja.
      - name: nombre
        description: Nombre (a veces en mayusculas).
      - name: apellidos
        description: Apellidos.
      - name: fecha_alta
        description: Fecha de alta en la empresa.
      - name: puesto
        description: Encargada o Dependienta (a veces en mayusculas).
      - name: horas_semanales
        description: Jornada de contrato en horas por semana.
      - name: _loaded_at
        description: Momento de la carga en Bronze.
