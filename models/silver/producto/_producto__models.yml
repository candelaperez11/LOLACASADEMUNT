# =============================================================================
# Modelos Silver de producto
# =============================================================================
# Entidades del catalogo en 3FN: marca, temporada, capsula y producto.
# Cada modelo garantiza una fila por clave: unique + not_null en la PK y
# relationships hacia sus padres.
# =============================================================================

models:
  - name: slv_producto__marca
    description: Marcas, una fila por marca. Sale de la primera letra de la referencia.
    columns:
      - name: marca_id
        description: L = Lola Casademunt, M = Maite.
        data_tests: [unique, not_null]
      - name: marca_nombre
        description: Nulo si la letra de la referencia no es una marca conocida.
        data_tests: [not_null]

  - name: slv_producto__temporada
    description: Temporadas, una fila por temporada, con sus fechas segun el calendario comercial.
    columns:
      - name: temporada_id
        description: Codigo de la temporada (FW25-26, SS26...).
        data_tests: [unique, not_null]
      - name: tipo
        description: FW = Otoño-Invierno, SS = Primavera-Verano.
        data_tests:
          - accepted_values:
              arguments:
                values: ['FW', 'SS']
      - name: temporada_nombre
        data_tests: [not_null]
      - name: anio_inicio
        data_tests: [not_null]
      - name: fecha_inicio_venta
        description: FW 1 de septiembre / SS 1 de marzo.
        data_tests: [not_null]
      - name: fecha_fin_venta
        description: FW ultimo dia de febrero del año siguiente / SS 31 de agosto.
        data_tests: [not_null]

  - name: slv_producto__capsula
    description: Capsulas, una fila por capsula. El mismo codigo puede repetirse en distintas temporadas.
    columns:
      - name: capsula_id
        description: Clave de la capsula, hash de temporada_id + capsula_codigo.
        data_tests: [unique, not_null]
      - name: capsula_codigo
        description: Codigo de la capsula (L1, M2...). En las Resort sin codigo, el nombre en mayusculas.
        data_tests: [not_null]
      - name: temporada_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_producto__temporada')
                field: temporada_id

  - name: slv_producto__producto
    description: Productos, una fila por referencia, con las reglas de negocio aplicadas.
    columns:
      - name: referencia
        description: Codigo del producto, con guion bajo y en mayusculas.
        data_tests: [unique, not_null]
      - name: marca_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_producto__marca')
                field: marca_id
      - name: temporada_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_producto__temporada')
                field: temporada_id
      - name: codigo_familia
        description: Digitos 5-6 de la referencia.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('familias_agregadas')
                field: codigo_familia
      - name: capsula_id
        description: Nulo si el producto no tiene capsula o es un accesorio.
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_producto__capsula')
                field: capsula_id
      - name: producto_nombre
        data_tests: [not_null]
      - name: es_45_aniversario
        description: TRUE si el nombre original llevaba el sufijo 45a.
        data_tests: [not_null]
      - name: pvp_es
        description: Precio en España. Si no venia, mediana del precio de su familia.
        data_tests: [not_null]
      - name: es_precio_imputado
        description: TRUE si el precio es la mediana de la familia (no venia en el lookbook).
      - name: fecha_entrada
        description: Fecha de entrada en tienda. Nula en FW25-26 (el lookbook no la trae).